version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 624858524166.dkr.ecr.us-east-2.amazonaws.com

  build:
    commands:
      - echo Building Docker image
      - docker build -t node-aws-app .

  post_build:
    commands:
      - echo Tagging Docker image
      - docker tag node-aws-app:latest 624858524166.dkr.ecr.us-east-2.amazonaws.com/job-repo:latest
      - echo Pushing Docker image to ECR
      - docker push 624858524166.dkr.ecr.us-east-2.amazonaws.com/job-repo:latest
